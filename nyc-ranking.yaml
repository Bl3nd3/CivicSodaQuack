# Generated by: csq modes init ranking --portal data.cityofnewyork.us
# City ranking — comparable indicators, normalised per resident — New York, NY
#
# Compares every attached city on the indicators both publish, normalised by
# population. Each query runs once per city and the results are stacked for
# comparison. Cities that do not publish an indicator, or that have no
# population recorded, are excluded from that comparison by name — never
# shown as zero or blank. There is deliberately no overall score: these are
# separate measures of separate things, and combining them would be an
# editorial choice pretending to be a calculation.
#
# Portal notes:
#   - NYPD complaint data and Chicago's crime data are both 'reported
#     offences' but are built on different legal categories and recording
#     rules. Compare trends within a city with more confidence than levels
#     between cities.
#   - New York's 311 is among the most heavily used in the country, which
#     raises request volume for reasons unrelated to underlying conditions.
#   - DOB permit issuance counts renewals and subtypes as separate rows, so
#     the per-capita permit rate is not comparable to a city that files once
#     per job without normalising first.
#
# Interpretation caveats:
#   - These are separate indicators, not a ranking. There is deliberately no
#     overall score: combining crime, service responsiveness, and
#     construction into one number requires a weighting that is an editorial
#     judgement, and presenting it as arithmetic would be dishonest.
#   - A city missing from a comparison is missing because it does not
#     publish that indicator or has no recorded population — never because
#     it scored zero. Read the exclusion list before drawing any conclusion
#     from who is present.
#   - Reported crime is not crime. It measures what residents report and
#     what a department records. A city with higher trust in police, or
#     better reporting channels, will show more reported offences for
#     identical underlying conditions. Never read these rates as relative
#     danger.
#   - Offence categories, 311 request types, and permit rules are set by
#     each city independently. Two cities' 'theft' or 'pothole' may not
#     cover the same ground, so composition comparisons are indicative at
#     best.
#   - Population is a single declared figure, not a time series. Rates for
#     earlier years are computed against today's population and will be
#     wrong in proportion to how much the city has grown or shrunk.
#   - City boundaries are not metro areas. A city whose suburbs sit outside
#     its boundary reports different rates from one that annexed them, with
#     no difference on the ground.
#   - This cannot tell you where to live. It compares a handful of things
#     two bureaucracies happen to publish, which is not the same as what a
#     place is like to live in — and says nothing about cost, schools,
#     transit, or anything at neighbourhood scale, where variation within a
#     city usually exceeds the variation between cities.

portal: data.cityofnewyork.us
# app_token: ${SOCRATA_APP_TOKEN}   # anonymous works but is rate-limited
concurrency: 4
on_error: continue

defaults:
  batch_size: 10000
  order_by: ":id"

include:
  - id: qgea-i56i    # crimes → NYPD Complaint Data Historic (~10,071,507 rows)
  - id: erm2-nwe9    # service_requests → 311 Service Requests from 2020 to Present (~22,123,771 rows)
  - id: ipu4-2q9a    # building_permits → DOB Permit Issuance (~3,989,937 rows)

overrides:
  qgea-i56i:
    table: nypd_complaints
  erm2-nwe9:
    table: requests_311
  ipu4-2q9a:
    table: dob_permits
