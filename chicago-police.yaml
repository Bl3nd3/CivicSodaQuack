# Generated by: csq modes init police --portal data.cityofchicago.org
# Police monitoring — civilian oversight of the department — Chicago, IL
#
# Civilian-side oversight. Reads the published accountability caseload —
# complaints against officers, the categories they fall into, and how they
# resolve — and asks what the public complains about, how often complaints
# are sustained, and how outcomes vary. Arrest volume is used only as a
# denominator for normalising complaint rates.
#
# Portal notes:
#   - Chicago's published COPA and BIA extracts carry no officer identifier,
#     so repeat-officer analysis is impossible with them. That is a
#     deliberate upstream choice, not a sync gap — a city that does
#     publish identifiers will support analyses Chicago cannot.
#   - Chicago publishes no use-of-force or tactical-response dataset on this
#     portal, so force is only visible through the police_shooting flag on
#     complaints.
#
# Interpretation caveats:
#   - A complaint is an allegation. It records that someone came forward,
#     not that anything was substantiated.
#   - An unsustained or unfounded finding does not mean the complaint was
#     false. It means the evidence available did not meet the investigator's
#     standard of proof, which is a different claim.
#   - Finding codes and category labels are portal-specific, change over
#     time, and are rarely backfilled. Check the current code list before
#     mapping a code to 'sustained', and be wary of trends crossing a schema
#     change.
#   - Complaint counts are not misconduct rates. An area with more
#     complaints may have more enforcement activity, more residents willing
#     to file, or both — normalise against arrests before ranking
#     anything.
#   - Complaint volume is not comparable between cities. It reflects how
#     easy a city makes filing, how much it publishes, and which bodies it
#     routes cases through — never rank departments on these counts.
#   - Where a portal de-identifies officers, repeat-subject analysis is
#     impossible by construction. Check the binding's notes before assuming
#     otherwise.

portal: data.cityofchicago.org
# app_token: ${SOCRATA_APP_TOKEN}   # anonymous works but is rate-limited
concurrency: 4
on_error: continue

defaults:
  batch_size: 10000
  order_by: ":id"

include:
  - id: mft5-nfa8    # complaints → COPA Cases - Summary (~189,405 rows)
  - id: ufxy-tgry    # complaints_by_officer → COPA Cases - By Involved Officer (~214,782 rows)
  - id: vnz2-rmie    # complaints_by_complainant → COPA Cases - By Complainant or Subject (~204,678 rows)
  - id: dpt3-jri9    # arrests → Arrests (~741,043 rows)

overrides:
  mft5-nfa8:
    table: copa_cases
  ufxy-tgry:
    table: copa_by_officer
  vnz2-rmie:
    table: copa_by_complainant
  dpt3-jri9:
    table: arrests
