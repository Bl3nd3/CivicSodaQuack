# Generated by: csq modes init corruption --portal data.cityofchicago.org
# Corruption detection — procurement and influence trails — Chicago, IL
#
# Writes to its own database file rather than data.cityofchicago.org.duckdb.
# The portal lock is taken per database file, so this syncs happily alongside a
# run already holding the main Chicago database instead of contending for it.
# Point `csq modes run` at it with --portal data.cityofchicago.org, since the
# portal is otherwise derived from the filename.
#
# Concurrency is 2 rather than the usual 4: anonymous requests are rate limited
# per IP, and this shares that budget with any other sync running against the
# same portal.

portal: data.cityofchicago.org
db: chicago-corruption.duckdb
# app_token: ${SOCRATA_APP_TOKEN}   # anonymous works but is rate-limited
concurrency: 2
on_error: continue

defaults:
  batch_size: 10000
  order_by: ":id"

include:
  - id: rsxa-ify5    # contracts → Contracts (~185,699 rows)
  - id: dw2f-w78u    # lobbyist_compensation → Lobbyist Data - Compensation (~40,961 rows)
  - id: p9p7-vfqc    # lobbyist_contributions → Lobbyist Data - Contributions (~9,053 rows)

overrides:
  rsxa-ify5:
    table: contracts
  dw2f-w78u:
    table: lobbyist_compensation
  p9p7-vfqc:
    table: lobbyist_contributions
